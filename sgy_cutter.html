<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGY Cutter</title>
<style>
  :root {
    --bg-main: #0a0e14; --bg-surface: #151b24; --bg-elevated: #1e2630;
    --primary: #00d4aa; --primary-hover: #00f5c4; --secondary: #ff6b35;
    --text-primary: #e6edf3; --text-secondary: #8b949e; --border: #30363d;
    --positive: #3fb950; --negative: #f85149; --radius: 6px;
    --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-main); color: var(--text-primary);
    font-family: var(--font-ui); font-size: 14px;
  }
  header {
    height: 50px; display: flex; align-items: center; gap: 12px;
    padding: 0 24px; border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
  }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header .logo { color: var(--primary); }
  main {
    max-width: 980px; margin: 24px auto; padding: 0 16px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .drop {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 32px 16px; text-align: center; cursor: pointer;
    color: var(--text-secondary); transition: border-color .15s, color .15s;
  }
  .drop:hover, .drop.drag { border-color: var(--primary); color: var(--primary); }
  .info {
    margin-top: 12px; font-family: var(--font-mono); font-size: 12px;
    display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
  }
  .info span:nth-child(odd) { color: var(--text-secondary); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  select, input[type=number], input[type=text] {
    width: 100%; background: var(--bg-elevated); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 7px 10px; font-size: 13px; font-family: var(--font-ui);
  }
  select:focus, input:focus { outline: none; border-color: var(--primary); }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; }
  button {
    border: none; border-radius: var(--radius); padding: 10px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--font-ui);
  }
  .btn-primary { background: var(--primary); color: #062a23; width: 100%; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  a.btn-download {
    display: block; text-align: center; text-decoration: none;
    background: var(--secondary); color: #2b1206; padding: 10px 16px;
    border-radius: var(--radius); font-weight: 600; margin-top: 8px;
  }
  .toggle {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    margin: 8px 0; color: var(--text-secondary); cursor: pointer;
  }
  .toggle input { accent-color: var(--primary); }
  .progress {
    height: 6px; background: var(--bg-elevated); border-radius: 3px;
    overflow: hidden; margin: 10px 0; display: none;
  }
  .progress .bar { height: 100%; width: 0; background: var(--primary); transition: width .15s; }
  .log {
    margin-top: 12px; padding: 12px; border-radius: var(--radius);
    background: var(--bg-elevated); font-family: var(--font-mono);
    font-size: 12px; white-space: pre-wrap; word-break: break-word;
    min-height: 60px; max-height: 340px; overflow-y: auto;
  }
  .ok { color: var(--positive); }
  .err { color: var(--negative); }
  .dim { color: var(--text-secondary); }
</style>
</head>
<body>
<header>
  <span class="logo">&#9776;&#9776;</span>
  <h1>SGY Cutter</h1>
  <span class="dim">cut SEG-Y by first sorting key range &middot; streams large files, works beyond 4 GB</span>
</header>
<main>
  <div class="card">
    <h2>1. Source SEG-Y</h2>
    <div class="drop" id="drop">
      Drag &amp; drop a .sgy / .segy file here<br>
      <span class="dim" style="font-size:12px">or click to browse</span>
    </div>
    <input type="file" id="fileInput" accept=".sgy,.segy" style="display:none">
    <div class="progress" id="loadProgress"><div class="bar" id="loadBar"></div></div>
    <div class="info" id="fileInfo"></div>
  </div>
  <div class="card">
    <h2>2. Cut parameters</h2>
    <div class="field">
      <label>First sorting key</label>
      <select id="keySelect">
        <option value="8">FFID (byte 9)</option>
        <option value="12">CHAN (byte 13)</option>
        <option value="20">CDP (byte 21)</option>
        <option value="36">Offset (byte 37)</option>
        <option value="188">Inline (byte 189)</option>
        <option value="192">Xline (byte 193)</option>
      </select>
    </div>
    <div class="row">
      <div class="field">
        <label>Min (blank = first)</label>
        <input type="number" id="minKey" placeholder="no limit">
      </div>
      <div class="field">
        <label>Max (blank = last)</label>
        <input type="number" id="maxKey" placeholder="no limit">
      </div>
    </div>
    <div id="keyRangeHint" class="dim" style="font-size:12px; margin:-4px 0 12px;"></div>
    <div class="field">
      <label>Trace time cut (optional)</label>
      <div class="row">
        <div class="field">
          <label>Start time (ms, blank = 0)</label>
          <input type="number" id="startTime" placeholder="0">
        </div>
        <div class="field">
          <label>End time (ms, blank = record end)</label>
          <input type="number" id="endTime" placeholder="record end">
        </div>
      </div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="sortToggle">
      Sort output by this key (default keeps input order)
    </label>
    <button class="btn-primary" id="cutBtn" disabled>Cut</button>
    <div class="progress" id="cutProgress"><div class="bar" id="cutBar"></div></div>
    <a class="btn-download" id="downloadLink" style="display:none">Download cut .sgy</a>
    <div class="log" id="log"></div>
  </div>
</main>
<script>
(function () {
  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('fileInput');
  var fileInfo = document.getElementById('fileInfo');
  var keySelect = document.getElementById('keySelect');
  var minKey = document.getElementById('minKey');
  var maxKey = document.getElementById('maxKey');
  var sortToggle = document.getElementById('sortToggle');
  var startTime = document.getElementById('startTime');
  var endTime = document.getElementById('endTime');
  var cutBtn = document.getElementById('cutBtn');
  var downloadLink = document.getElementById('downloadLink');
  var keyRangeHint = document.getElementById('keyRangeHint');
  var log = document.getElementById('log');
  var loadProgress = document.getElementById('loadProgress');
  var loadBar = document.getElementById('loadBar');
  var cutProgress = document.getElementById('cutProgress');
  var cutBar = document.getElementById('cutBar');

  var currentFile = null;
  var meta = null;
  var resultBlob = null;
  var busy = false;

  var KEY_OFFSETS = {8: 'FFID', 12: 'CHAN', 20: 'CDP', 36: 'Offset', 188: 'Inline', 192: 'Xline'};
  var SAMPLE_BYTES = {1:4, 2:4, 3:2, 4:4, 5:4, 6:8, 7:3, 8:1};
  var CHUNK_BYTES = 32 * 1024 * 1024;
  var OUT_BYTES = 32 * 1024 * 1024;

  function fmt(n) { return n.toLocaleString('en-US'); }

  function say(msg, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function setProgress(el, bar, ratio) {
    if (ratio == null) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    bar.style.width = Math.round(Math.min(1, Math.max(0, ratio)) * 100) + '%';
  }

  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) loadFile(fileInput.files[0]);
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('drag'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer.files && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });

  async function loadFile(file) {
    if (busy) return;
    busy = true;
    log.innerHTML = '';
    currentFile = null; meta = null; resultBlob = null;
    cutBtn.disabled = true; downloadLink.style.display = 'none';
    try {
      say('Reading headers of ' + file.name + ' (' + fmt(file.size) + ' bytes) ...');
      currentFile = file;
      meta = await parseHeader(file);
      say('Scanning key-header ranges (bytes 9, 13, 21, 37, 189, 193) ...');
      meta.keyRanges = await scanKeyRanges(function (done, total) {
        setProgress(loadProgress, loadBar, done / total);
      });
      showInfo();
      cutBtn.disabled = false;
      updateKeyHint();
      say('Loaded: ' + fmt(meta.traces) + ' traces, ' + meta.ns + ' samples, dt ' + meta.dtUs + ' \u00b5s', 'ok');
    } catch (err) {
      say('Error: ' + err.message, 'err');
    } finally {
      setProgress(loadProgress, loadBar, null);
      busy = false;
    }
  }

  async function scanKeyRanges(onProgress) {
    var stride = meta.stride;
    var tpc = tracesPerChunk();
    var ranges = {};
    Object.keys(KEY_OFFSETS).forEach(function (o) { ranges[o] = [Infinity, -Infinity]; });
    for (var start = 0; start < meta.traces; start += tpc) {
      var n = Math.min(tpc, meta.traces - start);
      var ab = await currentFile.slice(meta.dataStart + start * stride, meta.dataStart + (start + n) * stride).arrayBuffer();
      var view = new DataView(ab);
      for (var i = 0; i < n; i++) {
        var base = i * stride;
        Object.keys(KEY_OFFSETS).forEach(function (o) {
          var off = parseInt(o, 10);
          var v = meta.le ? view.getInt32(base + off, true) : view.getInt32(base + off, false);
          if (v < ranges[o][0]) ranges[o][0] = v;
          if (v > ranges[o][1]) ranges[o][1] = v;
        });
      }
      if (onProgress) onProgress(start + n, meta.traces);
      await yieldToUi();
    }
    return ranges;
  }

  async function parseHeader(file) {
    if (file.size < 3600) throw new Error('File is too small to be SEG-Y');
    var head = await file.slice(0, 3600).arrayBuffer();
    var view = new DataView(head);
    var le = false;
    var fmtCode = view.getInt16(3224, false);
    if (!(fmtCode >= 1 && fmtCode <= 8)) {
      fmtCode = view.getInt16(3224, true);
      le = true;
      if (!(fmtCode >= 1 && fmtCode <= 8)) throw new Error('Unknown SEG-Y format code');
    }
    var dtUs = view.getInt16(3216, le);
    var ns = view.getInt16(3220, le);
    var extText = view.getInt16(3504, le);
    if (ns <= 0) ns = view.getInt32(3468, le);
    if (ns <= 0) throw new Error('Invalid samples per trace');
    if (dtUs <= 0) throw new Error('Invalid sample interval');
    var bytes = SAMPLE_BYTES[fmtCode];
    if (!bytes) throw new Error('Unsupported sample format ' + fmtCode);
    var dataStart = 3600 + 3200 * extText;
    if (file.size < dataStart + 240 + ns * bytes) throw new Error('File is shorter than its header declares');
    var stride = 240 + ns * bytes;
    var traces = Math.floor((file.size - dataStart) / stride);
    if (traces < 1) throw new Error('No complete traces found');
    var remainder = (file.size - dataStart) % stride;
    return {
      name: file.name, size: file.size, le: le, fmtCode: fmtCode, dtUs: dtUs, ns: ns,
      extText: extText, dataStart: dataStart, stride: stride, traces: traces,
      remainder: remainder, keyRanges: null,
    };
  }

  function showInfo() {
    fileInfo.innerHTML = '';
    var rows = [
      ['File', meta.name],
      ['Size', fmt(meta.size) + ' bytes'],
      ['Endianness', meta.le ? 'little' : 'big'],
      ['Format', 'code ' + meta.fmtCode + ' (' + SAMPLE_BYTES[meta.fmtCode] + ' B/sample)'],
      ['Sample interval', meta.dtUs + ' \u00b5s'],
      ['Samples per trace', fmt(meta.ns)],
      ['Record length', (meta.ns - 1) * meta.dtUs / 1000 + ' ms'],
      ['Extended text headers', meta.extText],
      ['Traces', fmt(meta.traces)],
    ];
    if (meta.remainder) rows.push(['Warning', fmt(meta.remainder) + ' trailing bytes ignored']);
    if (meta.keyRanges) {
      Object.keys(KEY_OFFSETS).forEach(function (o) {
        var r = meta.keyRanges[o];
        rows.push([KEY_OFFSETS[o] + ' range (byte ' + (parseInt(o, 10) + 1) + ')', fmt(r[0]) + ' - ' + fmt(r[1])]);
      });
    }
    rows.forEach(function (r) {
      var k = document.createElement('span'); k.textContent = r[0];
      var v = document.createElement('span'); v.textContent = r[1];
      fileInfo.appendChild(k); fileInfo.appendChild(v);
    });
  }

  function updateKeyHint() {
    var o = keySelect.value;
    if (meta && meta.keyRanges && meta.keyRanges[o]) {
      var r = meta.keyRanges[o];
      keyRangeHint.textContent = KEY_OFFSETS[o] + ' range in file: ' + fmt(r[0]) + ' - ' + fmt(r[1]);
    } else if (meta) {
      keyRangeHint.textContent = 'Scanning key-header ranges ...';
    } else {
      keyRangeHint.textContent = '';
    }
  }

  keySelect.addEventListener('change', updateKeyHint);

  function tracesPerChunk() {
    return Math.max(1, Math.floor(CHUNK_BYTES / meta.stride));
  }

  async function scanHeaders(minVal, maxVal, onProgress) {
    var stride = meta.stride;
    var tpc = tracesPerChunk();
    var selIdx = new Int32Array(meta.traces);
    var selKey = new Int32Array(meta.traces);
    var count = 0;
    for (var start = 0; start < meta.traces; start += tpc) {
      var n = Math.min(tpc, meta.traces - start);
      var ab = await currentFile.slice(meta.dataStart + start * stride, meta.dataStart + (start + n) * stride).arrayBuffer();
      var view = new DataView(ab);
      for (var i = 0; i < n; i++) {
        var base = i * stride;
        var keyOffset = parseInt(keySelect.value, 10);
        var key = meta.le ? view.getInt32(base + keyOffset, true) : view.getInt32(base + keyOffset, false);
        if (minVal !== null && key < minVal) continue;
        if (maxVal !== null && key > maxVal) continue;
        selIdx[count] = start + i;
        selKey[count] = key;
        count++;
      }
      if (onProgress) onProgress(start + n, meta.traces);
      await yieldToUi();
    }
    return { selIdx: selIdx, selKey: selKey, count: count };
  }

  function yieldToUi() {
    return new Promise(function (resolve) { setTimeout(resolve, 0); });
  }

  cutBtn.addEventListener('click', async function () {
    if (busy || !currentFile || !meta) return;
    busy = true;
    cutBtn.disabled = true;
    var keyOffset = parseInt(keySelect.value, 10);
    var minVal = minKey.value === '' ? null : Math.floor(Number(minKey.value));
    var maxVal = maxKey.value === '' ? null : Math.floor(Number(maxKey.value));
    var tStart = startTime.value === '' ? null : Number(startTime.value);
    var tEnd = endTime.value === '' ? null : Number(endTime.value);
    if (minKey.value !== '' && !Number.isFinite(minVal)) { say('Invalid min value', 'err'); busy = false; cutBtn.disabled = false; return; }
    if (maxKey.value !== '' && !Number.isFinite(maxVal)) { say('Invalid max value', 'err'); busy = false; cutBtn.disabled = false; return; }
    if (tStart !== null && (!Number.isFinite(tStart) || tStart < 0)) { say('Invalid start time', 'err'); busy = false; cutBtn.disabled = false; return; }
    if (tEnd !== null && (!Number.isFinite(tEnd) || tEnd < 0)) { say('Invalid end time', 'err'); busy = false; cutBtn.disabled = false; return; }
    var timeCut = computeTimeCut(tStart, tEnd);
    try {
      say('Scanning trace headers ...');
      var sel = await scanHeaders(minVal, maxVal, function (done, total) {
        setProgress(cutProgress, cutBar, done / total);
      });
      if (sel.count === 0) throw new Error('No traces match the selected key range');
      var order = null;
      if (sortToggle.checked) {
        say('Sorting ' + fmt(sel.count) + ' traces by key ...');
        order = Array.from(sel.selIdx.subarray(0, sel.count));
        var keys = sel.selKey;
        order.sort(function (a, b) { return keys[a] - keys[b] || a - b; });
      }
      if (timeCut.applied) say('Time cut: ' + timeCut.startMs + ' - ' + timeCut.endMs + ' ms (' + timeCut.nsOut + ' samples)');
      say('Writing output (' + fmt(sel.count) + ' traces) ...');
      resultBlob = await writeOutput(sel, order, timeCut, function (done, total) {
        setProgress(cutProgress, cutBar, done / total);
      });
      var base = meta.name.replace(/\.sgy$/i, '').replace(/\.segy$/i, '');
      var outName = base + '_cut.sgy';
      if (downloadLink.href) URL.revokeObjectURL(downloadLink.href);
      downloadLink.href = URL.createObjectURL(resultBlob);
      downloadLink.download = outName;
      downloadLink.style.display = 'block';
      say('Cut ' + fmt(sel.count) + ' of ' + fmt(meta.traces) + ' traces' + (sortToggle.checked ? ' (sorted by key)' : ' (input order kept)'), 'ok');
      say('Ready: ' + outName);
    } catch (err) {
      say('Error: ' + err.message, 'err');
    } finally {
      setProgress(cutProgress, cutBar, null);
      busy = false;
      cutBtn.disabled = false;
    }
  });

  function computeTimeCut(tStart, tEnd) {
    var bytes = SAMPLE_BYTES[meta.fmtCode];
    var dtUs = meta.dtUs;
    var ns = meta.ns;
    var startSample = tStart === null ? 0 : Math.round(tStart * 1000 / dtUs);
    var endSample = tEnd === null ? ns - 1 : Math.round(tEnd * 1000 / dtUs);
    startSample = Math.max(0, Math.min(startSample, ns - 1));
    endSample = Math.max(0, Math.min(endSample, ns - 1));
    if (startSample > endSample) throw new Error('Start time is beyond the end of the record');
    var nsOut = endSample - startSample + 1;
    var startMs = Math.round(startSample * dtUs / 1000);
    var endMs = Math.round(endSample * dtUs / 1000);
    return {
      applied: nsOut !== ns || startSample !== 0,
      startSample: startSample,
      endSample: endSample,
      nsOut: nsOut,
      startMs: startMs,
      endMs: endMs,
      strideOut: 240 + nsOut * bytes,
    };
  }

  async function writeOutput(sel, order, timeCut, onProgress) {
    var stride = meta.stride;
    var strideOut = timeCut.strideOut;
    var nsOut = timeCut.nsOut;
    var startSample = timeCut.startSample;
    var bytes = SAMPLE_BYTES[meta.fmtCode];
    var delayMs = timeCut.startMs;
    var count = sel.count;
    var parts = [];
    var head = await currentFile.slice(0, 3600).arrayBuffer();
    var dv = new DataView(head);
    dv.setInt16(3212, count > 65535 ? 65535 : count, meta.le);
    dv.setInt16(3220, nsOut > 65535 ? 65535 : nsOut, meta.le);
    dv.setInt32(3468, nsOut, meta.le);
    parts.push(new Blob([head], { type: 'application/octet-stream' }));
    if (meta.dataStart > 3600) parts.push(currentFile.slice(3600, meta.dataStart));
    var outBuf = new Uint8Array(OUT_BYTES);
    var outPos = 0;
    var srcChunkBytes = tracesPerChunk() * stride;
    var cache = new Map();
    var cacheOrder = [];
    var CACHE_MAX = 6;
    async function sourceChunk(chunkIndex) {
      if (cache.has(chunkIndex)) return cache.get(chunkIndex);
      var start = chunkIndex * srcChunkBytes;
      var end = Math.min(start + srcChunkBytes, meta.traces * stride);
      var ab = await currentFile.slice(meta.dataStart + start, meta.dataStart + end).arrayBuffer();
      cache.set(chunkIndex, new DataView(ab));
      cacheOrder.push(chunkIndex);
      while (cacheOrder.length > CACHE_MAX) {
        var old = cacheOrder.shift();
        cache.delete(old);
      }
      return cache.get(chunkIndex);
    }
    function flush() {
      if (outPos > 0) {
        var part = new Uint8Array(outPos);
        part.set(outBuf.subarray(0, outPos));
        parts.push(new Blob([part], { type: 'application/octet-stream' }));
        outPos = 0;
      }
    }
    for (var j = 0; j < count; j++) {
      var rec = order ? order[j] : sel.selIdx[j];
      var srcPos = rec * stride;
      var chunkIndex = Math.floor(srcPos / srcChunkBytes);
      var chunk = await sourceChunk(chunkIndex);
      var off = srcPos - chunkIndex * srcChunkBytes;
      var room = OUT_BYTES - outPos;
      if (room < strideOut) flush();
      for (var h = 0; h < 240; h++) outBuf[outPos + h] = chunk.getUint8(off + h);
      var hdr = new DataView(outBuf.buffer, outBuf.byteOffset + outPos, 240);
      hdr.setInt16(108, delayMs, meta.le);
      hdr.setInt16(114, nsOut, meta.le);
      hdr.setInt16(116, meta.dtUs, meta.le);
      var srcSamples = off + 240 + startSample * bytes;
      for (var s = 0; s < nsOut * bytes; s++) outBuf[outPos + 240 + s] = chunk.getUint8(srcSamples + s);
      outPos += strideOut;
      if ((j & 4095) === 0) {
        if (onProgress) onProgress(j + 1, count);
        await yieldToUi();
      }
    }
    flush();
    return new Blob(parts, { type: 'application/octet-stream' });
  }
})();
</script>
</body>
</html>
